name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - pnpm-lock.yaml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - package.json
      - pnpm-lock.yaml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
