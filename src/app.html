<!doctype html>
<html lang="en" dir="auto">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="description"
      content="Forrest Deters is a web developer, musician, and games enthusiast based in the Portland, Oregon area. This is his website!"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem('site-theme');
        const dark =
          savedTheme === 'dark' ||
          (savedTheme !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (error) {
        console.warn('Unable to load the saved theme preference.', error);
        document.documentElement.dataset.theme = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches
          ? 'dark'
          : 'light';
      }
    </script>
    %sveltekit.head%
  </head>
  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
